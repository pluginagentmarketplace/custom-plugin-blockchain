# DevOps Configuration - Blockchain Plugin
# Blockchain Infrastructure & Node Operations
# Version: 1.0.0

project:
  name: "${PROJECT_NAME}"
  type: "blockchain-infra"

# Node Operations
nodes:
  ethereum:
    client: "geth"  # geth, erigon, nethermind
    mode: "full"  # full, archive, light

    sync:
      type: "snap"  # snap, full, fast
      checkpoint: true

    hardware:
      cpu: 4
      memory: "16GB"
      storage: "2TB SSD"
      network: "100Mbps"

  validator:
    client: "prysm"  # prysm, lighthouse, teku
    enabled: false
    keys_path: "/secrets/validator-keys"

# Container Orchestration
kubernetes:
  namespace: "blockchain"

  deployments:
    - name: "ethereum-node"
      replicas: 2
      resources:
        cpu: "4"
        memory: "16Gi"
        storage: "2Ti"

    - name: "indexer"
      replicas: 1
      resources:
        cpu: "2"
        memory: "8Gi"

# Monitoring
monitoring:
  prometheus:
    enabled: true
    scrape_interval: 15s

  grafana:
    dashboards:
      - node_health
      - sync_status
      - peer_count
      - gas_prices

  alerts:
    - name: "node_sync_lag"
      threshold: 100  # blocks
    - name: "peer_count_low"
      threshold: 10
    - name: "disk_usage_high"
      threshold: 85  # percent

# Security
security:
  firewall:
    allow_p2p: true
    p2p_port: 30303
    rpc_internal_only: true

  secrets:
    provider: "vault"
    keys:
      - validator_keys
      - jwt_secret
      - api_keys

# Backup
backup:
  enabled: true
  schedule: "0 3 * * *"
  retention_days: 7
  storage: "s3"
