# Frontend Development Configuration - Blockchain Plugin
# Web3 & DApp Frontend Development
# Version: 1.0.0

project:
  name: "${PROJECT_NAME}"
  type: "dapp"  # dapp, web3-wallet, nft-marketplace
  framework: "react"

# Web3 Integration
web3:
  providers:
    - wagmi
    - ethers
    - web3-react

  wallet_connectors:
    - metamask
    - walletconnect
    - coinbase-wallet
    - rainbow-kit

  networks:
    mainnet:
      chainId: 1
      rpc_url: "${MAINNET_RPC_URL}"
    sepolia:
      chainId: 11155111
      rpc_url: "${SEPOLIA_RPC_URL}"
    polygon:
      chainId: 137
      rpc_url: "${POLYGON_RPC_URL}"

# DApp Configuration
dapp:
  features:
    - wallet_connection
    - transaction_signing
    - contract_interaction
    - nft_display
    - token_balances

  ens_support: true
  ipfs_gateway: "https://ipfs.io/ipfs/"

# UI Components
components:
  web3_specific:
    - WalletButton
    - NetworkSwitcher
    - TransactionStatus
    - TokenList
    - NFTGallery
    - AddressDisplay

  design_system:
    library: "chakra-ui"  # chakra-ui, tailwind, radix
    theme: "dark"

# State Management
state:
  global: "zustand"
  server: "tanstack-query"
  web3: "wagmi"

# TypeScript
typescript:
  strict: true
  paths:
    "@components/*": ["src/components/*"]
    "@hooks/*": ["src/hooks/*"]
    "@contracts/*": ["src/contracts/*"]
    "@utils/*": ["src/utils/*"]
    "@abi/*": ["src/abi/*"]

# Build Configuration
build:
  bundler: "vite"
  output_dir: "dist"

  environment_variables:
    - VITE_ALCHEMY_API_KEY
    - VITE_INFURA_PROJECT_ID
    - VITE_WALLET_CONNECT_PROJECT_ID

# Testing
testing:
  framework: "vitest"
  e2e: "playwright"

  mocking:
    web3_provider: true
    contract_calls: true
