# Database Configuration - Blockchain Plugin
# Blockchain Data Storage
# Version: 1.0.0

project:
  name: "${PROJECT_NAME}"
  type: "blockchain-indexer"

# Primary Database
postgresql:
  host: "${DB_HOST}"
  port: 5432
  database: "${DB_NAME}"

  tables:
    - blocks
    - transactions
    - events
    - token_transfers
    - contracts
    - addresses

  indexes:
    - blocks_number_idx
    - tx_hash_idx
    - events_contract_idx
    - addresses_balance_idx

# Time-Series Data
timescaledb:
  enabled: true
  hypertables:
    - name: "price_history"
      time_column: "timestamp"
      chunk_interval: "1 day"

    - name: "gas_metrics"
      time_column: "block_time"
      chunk_interval: "1 hour"

# Graph Database (for relationships)
neo4j:
  enabled: false
  use_cases:
    - token_flows
    - address_relationships
    - transaction_graphs

# Caching
redis:
  enabled: true
  cache_keys:
    - "balance:{address}"
    - "price:{token}"
    - "block:latest"

  ttl:
    balances: 30
    prices: 60
    metadata: 3600

# Indexer Settings
indexer:
  start_block: 0
  batch_size: 1000
  parallel_workers: 4

  event_signatures:
    Transfer: "0xddf252ad..."
    Approval: "0x8c5be1e5..."
    Swap: "0xd78ad95f..."
