# Data & AI Configuration - Blockchain Plugin
# Blockchain Data Analysis & ML
# Version: 1.0.0

project:
  name: "${PROJECT_NAME}"
  type: "blockchain-analytics"

# Data Sources
data_sources:
  onchain:
    - ethereum_mainnet
    - polygon
    - arbitrum

  providers:
    - dune_analytics
    - flipside
    - the_graph

  apis:
    etherscan: "${ETHERSCAN_API_KEY}"
    alchemy: "${ALCHEMY_API_KEY}"

# Analytics
analytics:
  metrics:
    - transaction_volume
    - active_addresses
    - gas_usage
    - token_transfers
    - defi_tvl

  time_series:
    granularity: ["1h", "1d", "1w"]
    retention_days: 365

# Machine Learning
ml:
  use_cases:
    - fraud_detection
    - whale_tracking
    - price_prediction
    - anomaly_detection

  models:
    fraud_detection:
      type: "classification"
      algorithm: "xgboost"
      features:
        - transaction_count
        - unique_addresses
        - gas_patterns
        - contract_interactions

  training:
    framework: "pytorch"
    experiment_tracking: "mlflow"

# Visualization
visualization:
  dashboards:
    - network_activity
    - token_flows
    - whale_movements

  charts:
    - sankey_diagrams
    - heatmaps
    - time_series
