# Backend Development Configuration - Blockchain Plugin
# Smart Contract & Blockchain Backend Development
# Version: 1.0.0

project:
  name: "${PROJECT_NAME}"
  type: "smart-contracts"  # smart-contracts, node, indexer, oracle

# Blockchain Networks
networks:
  ethereum:
    mainnet:
      rpc_url: "${ETH_MAINNET_RPC}"
      chain_id: 1
    sepolia:
      rpc_url: "${ETH_SEPOLIA_RPC}"
      chain_id: 11155111

  polygon:
    mainnet:
      rpc_url: "${POLYGON_RPC}"
      chain_id: 137

  arbitrum:
    mainnet:
      rpc_url: "${ARBITRUM_RPC}"
      chain_id: 42161

# Smart Contract Development
smart_contracts:
  framework: "foundry"  # foundry, hardhat, truffle
  language: "solidity"
  version: "0.8.20"

  foundry:
    optimizer:
      enabled: true
      runs: 200
    via_ir: false
    ffi: false

  testing:
    fuzz_runs: 1000
    invariant_runs: 100
    coverage_threshold: 90

  security:
    slither: true
    mythril: false
    certora: false

# API Backend
api:
  framework: "fastapi"  # fastapi, express, nest
  port: 8000

  endpoints:
    - /api/v1/contracts
    - /api/v1/transactions
    - /api/v1/events
    - /api/v1/balances

# Indexing
indexer:
  provider: "subgraph"  # subgraph, ponder, envio

  subgraph:
    network: "mainnet"
    start_block: 0
    entities:
      - Transfer
      - Approval
      - Swap

# Database
database:
  type: "postgresql"
  models:
    - transactions
    - events
    - contracts
    - users

# Caching
cache:
  provider: "redis"
  ttl:
    balances: 30
    prices: 60
    metadata: 3600

# Monitoring
monitoring:
  block_lag_threshold: 10
  rpc_health_check: true
  contract_events: true
